- name: functions
  hosts: local
  connection: local
  vars:
    technologies: Devops, linux, shell, cloud #string
    #dictionary==map
    tags:
      application: payment
      environment: dev
    list_tags:
    - key: application
      value: payment
    - key: environment
      value: dev
  tasks:
  - name: default variable
    ansible.builtin.debug:
      msg: " hello: {{ name | default ('ramesh') }}"
  #string to list
  - name: convert string to list
    ansible.builtin.debug:
     msg: " technologies are: {{ technologies | split(',') }}"

  - name: convert map to list
    ansible.builtin.debug:
      msg: " tags are: {{ tags | dict2items }}"

  - name: convert list to map
    ansible.builtin.debug:
      msg: " tag map: {{ list_tags | items2dict }}"