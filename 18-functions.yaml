- name: functions
  hosts: local
  connection: local
  vars:
    technologies: Devops, linux, shell, cloud #string
    #dictionary==map
    tags:
      application: payment
      environment: dev
    list_tags:
    - key: application
      value: payment
    - key: environment
      value: dev
    name: "shivananda Reddy"
    gmail: "SHIVANANDA6300@gamil.com"
    ipaddress: 192.0.999.0
  tasks:
  - name: default variable
    ansible.builtin.debug:
      msg: " hello: {{ name | default ('ramesh') }}"
  #string to list
  - name: convert string to list
    ansible.builtin.debug:
     msg: " technologies are: {{ technologies | split(',') }}"

  - name: convert map to list
    ansible.builtin.debug:
      msg: " tags are: {{ tags | dict2items }}"

  - name: convert list to map
    ansible.builtin.debug:
      msg: " tag map: {{ list_tags | items2dict }}"

#gather facts
#facts==variables

  - name: read yaml file and take it into variable
    ansible.builtin.set_fact:
      student_yaml: " {{ lookup( 'file', 'students.yaml' ) | from_yaml }}"
  
  - name: convert yaml into json
    ansible.builtin.debug:
      msg: " json: {{ student_yaml | to_json}}"

  - name: save json to file
    ansible.builtin.copy:
      dest: ./student-data.json
      content: "{{ student_yaml | to_json }}"

  - name: convert uppercase
    ansible.builtin.debug:
      msg: "{{ name | upper }}"

  - name: convert lowercase
    ansible.builtin.debug:
      msg: "{{ gmail | lower }}"

  - name: check Ip is valid or not
    ansible.builtin.debug:
      msg: "{{ ipaddress | ansible.utils.ipv4 }}"
