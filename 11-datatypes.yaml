- name: data types
  hosts: local
  connection: local
  vars:
    COURSE: "Devops with AWS" #string
    DURATION: 120 #number
    is_live: true #boolean
    tools: #["linux", "shell", "ansible"] or you can like #list
    - "linux"
    - "shell"
    - "ansible"
    concepts: #dictionary or map or object
      cloud: aws
      cm: ansible
  tasks:
  - name: print course info
    ansible.builtin.debug:
      msg: "course name is: {{ COURSE }} duration is: {{ DURATION }} HRS, is it live:{{ is_live }}, tools are: {{ tools }}, concepts are: {{ concepts}}"